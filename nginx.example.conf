# Exemplo de configuração nginx pra AIWA atrás de reverse proxy com SSL.
#
# Pré-requisitos:
#   - nginx instalado
#   - certbot (Let's Encrypt) instalado: sudo apt install -y certbot python3-certbot-nginx
#   - DNS apontando app.seudominio.com e api.seudominio.com pro IP do servidor
#
# Como aplicar:
#   1. Edite os 2 server_name abaixo trocando "seudominio.com"
#   2. sudo cp nginx.example.conf /etc/nginx/sites-available/aiwa.conf
#   3. sudo ln -s /etc/nginx/sites-available/aiwa.conf /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d app.seudominio.com -d api.seudominio.com
#      (o certbot edita o arquivo automaticamente, adicionando os blocos SSL)

# ──────────────────────────────────────────────────────────────────────────────
# Frontend (Next.js na 3000)
# ──────────────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name app.seudominio.com;

  client_max_body_size 64M;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }
}

# ──────────────────────────────────────────────────────────────────────────────
# Backend (Fastify na 3333)
# ──────────────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name api.seudominio.com;

  client_max_body_size 64M;

  # SSE precisa de buffering desligado pra streaming funcionar
  location /sse {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  location / {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
  }
}
