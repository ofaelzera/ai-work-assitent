services:
  mysql:
    image: mysql:8.0
    container_name: aiwa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aiwa}
      MYSQL_USER: ${MYSQL_USER:-aiwa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aiwapassword}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiwa-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: aiwa-evolution
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-changeme_evolution_key}
      DATABASE_ENABLED: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL:-http://host.docker.internal:3333/webhooks/whatsapp}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: 'false'
      CONFIG_SESSION_PHONE_CLIENT: AI Work Assistant
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - evolution_data:/evolution/instances
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  mysql_data:
  redis_data:
  evolution_data:
