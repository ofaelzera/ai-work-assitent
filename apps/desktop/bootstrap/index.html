<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aiwa — Conectar ao servidor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo">A</div>
      <h1>Aiwa Desktop</h1>
      <p class="subtitle">Informe o endereço do servidor para começar.</p>

      <form id="connect-form">
        <label for="server-url">URL do servidor</label>
        <input
          id="server-url"
          type="url"
          placeholder="https://app.suaempresa.com"
          autocomplete="off"
          spellcheck="false"
          required
        />
        <p id="error" class="error" hidden></p>
        <button id="connect-btn" type="submit">Conectar</button>
      </form>

      <p class="hint">
        Use <code>http://localhost:3000</code> para um servidor local de desenvolvimento.
      </p>
    </main>
    <script src="bootstrap.js"></script>
  </body>
</html>
